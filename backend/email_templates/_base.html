<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ subject }}</title>
  <style>
    body { margin: 0; padding: 0; background: #0B0F1A; font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #E2E8F0; -webkit-font-smoothing: antialiased; }
    .wrap { max-width: 600px; margin: 0 auto; padding: 40px 24px; }
    .card { background: linear-gradient(180deg, #111827 0%, #0F172A 100%); border: 1px solid rgba(255,255,255,0.06); border-radius: 20px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,0.4); }
    .stripe { height: 4px; background: linear-gradient(90deg, #6366F1, #EC4899); }
    .pad { padding: 40px 36px 32px; }
    .brand-row { display: flex; align-items: center; gap: 12px; margin-bottom: 32px; }
    .brand-mark { width: 32px; height: 32px; border-radius: 8px; background: linear-gradient(135deg, #6366F1, #EC4899); display: inline-block; }
    .brand-name { font-weight: 700; font-size: 15px; letter-spacing: -0.01em; color: #F8FAFC; }
    .eyebrow { font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: #64748B; margin: 0 0 10px; }
    h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; color: #F8FAFC; margin: 0 0 20px; line-height: 1.25; }
    p { font-size: 15px; line-height: 1.6; color: #CBD5E1; margin: 0 0 18px; }
    p.meta { color: #94A3B8; font-size: 14px; }
    .cta { display: inline-block; margin-top: 16px; padding: 14px 24px; background: linear-gradient(135deg, #6366F1, #EC4899); color: white !important; text-decoration: none; border-radius: 12px; font-weight: 600; font-size: 14px; letter-spacing: -0.01em; }
    .insight { margin-top: 28px; padding: 16px 18px; border-left: 2px solid #6366F1; background: rgba(99,102,241,0.06); border-radius: 6px; font-size: 13px; color: #C7D2FE; }
    .divider { height: 1px; background: rgba(255,255,255,0.06); margin: 32px 0 24px; }
    .footer { text-align: center; padding: 24px; color: #475569; font-size: 12px; line-height: 1.6; }
    .footer a { color: #6366F1; text-decoration: none; }
    .stats { display: table; width: 100%; margin: 12px 0 4px; }
    .stat { display: table-cell; padding: 14px 10px; text-align: center; background: rgba(255,255,255,0.03); border-radius: 10px; border: 1px solid rgba(255,255,255,0.04); }
    .stat + .stat { margin-left: 8px; }
    .stat .num { font-size: 22px; font-weight: 700; color: #F8FAFC; letter-spacing: -0.02em; display: block; }
    .stat .lbl { font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: #64748B; margin-top: 4px; display: block; }
    @media (prefers-color-scheme: light) {
      body { background: #FAFAFA; color: #0F172A; }
      .card { background: #FFFFFF; border-color: #E2E8F0; box-shadow: 0 10px 40px rgba(15,23,42,0.06); }
      h1, .brand-name { color: #0F172A; }
      p { color: #475569; }
      .eyebrow, .footer { color: #94A3B8; }
      .insight { background: #EEF2FF; color: #4338CA; border-color: #6366F1; }
      .stat { background: #F8FAFC; border-color: #E2E8F0; }
      .stat .num { color: #0F172A; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="stripe"></div>
      <div class="pad">
        <div class="brand-row">
          <span class="brand-mark"></span>
          <span class="brand-name">CreatorOS</span>
        </div>

        {% block content %}{% endblock %}

      </div>
    </div>

    <div class="footer">
      You're receiving this because you turned on alerts in CreatorOS.<br>
      <a href="{{ app_url }}/settings">Notification settings</a> · <a href="{{ app_url }}/dashboard">Open app</a>
    </div>
  </div>
</body>
</html>
