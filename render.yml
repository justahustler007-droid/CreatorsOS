# Render.com blueprint for the CreatorOS FastAPI backend.
# Push this repo to GitHub, then in Render dashboard:
#   New + → Blueprint → connect repo → Render reads this file automatically.
services:
  - type: web
    name: creatoros-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: MONGO_URL
        sync: false           # set manually in Render dashboard (MongoDB Atlas connection string)
      - key: DB_NAME
        value: creatoros
      - key: CORS_ORIGINS
        sync: false           # e.g. https://creatoros.netlify.app
      - key: EMERGENT_LLM_KEY
        sync: false           # optional — only needed for AI pricing
      - key: PYTHON_VERSION
        value: 3.11.9
